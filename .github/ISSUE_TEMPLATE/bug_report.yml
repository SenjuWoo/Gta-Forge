name: Bug report
description: A command crashed, gave a wrong answer, or a build/deploy misbehaved
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact gtaforge command you ran
      placeholder: gtaforge check --compile --project MyMod
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: JSON output
      description: The full output of that command. Replace your user folder with ~ before pasting.
      render: json
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gtaforge doctor
      description: Output of `gtaforge doctor` (paths trimmed the same way)
      render: json
  - type: input
    id: version
    attributes:
      label: Forge and game version
      placeholder: "forge 1.2.1, GTA V Enhanced 1.0.1158.16"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
