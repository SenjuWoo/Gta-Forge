name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python tests/run_tests.py
      - name: Build source archive (tracked files only)
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=gta-forge/ -o dist/gta-forge-${GITHUB_REF_NAME}.zip HEAD
          sha256sum dist/*.zip > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true