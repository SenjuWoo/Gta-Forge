[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-forge"
dynamic = ["version"]
description = "Make, check and ship single-player GTA V mods against the installed game; GTA VI day-one kit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GTA Forge contributors"}]
dependencies = []

[project.scripts]
gtaforge = "gtaforge.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gtaforge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtaforge = ["knowledge/*", "templates/**/*", "templates/**/.*"]